<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitter powder</title>
<meta name="description" content="Draw in glue, pour glitter over it, push it around, and blow it away to see what stuck.">
<style>
  :root { --ink: #1d1d1f; --line: rgb(0 0 0 / 0.08); --soft: #f4f4f5; }
  html, body { margin: 0; height: 100%; background: #fff; font: 13px/1.3 system-ui, -apple-system, sans-serif; color: var(--ink); }
  #root { position: fixed; inset: 0; }
  .bar {
    position: fixed; left: 50%; bottom: 20px; translate: -50% 0; z-index: 2;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 32px); padding: 8px; border-radius: 14px;
    background: rgb(255 255 255 / 0.86); backdrop-filter: blur(12px);
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgb(0 0 0 / 0.35);
  }
  .group { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--soft); }
  .bar button {
    border: 0; background: transparent; color: inherit; font: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer;
  }
  .bar button:hover { background: rgb(0 0 0 / 0.05); }
  .bar button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .bar .act { background: var(--ink); color: #fff; }
  .bar .act:hover { background: #3a3a3c; }
  .sw { width: 22px; height: 22px; padding: 0 !important; border-radius: 50% !important; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.12); }
  .sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .bar input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .hint { position: fixed; top: 18px; left: 50%; translate: -50% 0; z-index: 2; color: #8e8e93; pointer-events: none; text-align: center; padding: 0 16px; }
</style>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
} }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { createElement as h, useRef, useState } from 'react';
  import { createRoot } from 'react-dom/client';
  import { Glitter } from '../src/index.js';

  const COLORS = ['#f2a7c8', '#c9a7f2', '#9fd4f2', '#a8e6c3', '#f6d58e', '#f4a48a', '#e8e8ee'];
  const HINTS = {
    glue: 'Draw with glue. Then pour glitter over it and blow.',
    glitter: 'Sprinkle glitter by hand.',
    push: 'Push the glitter around. Flick fast to throw it. Hold still to blow.',
  };

  function App() {
    const g = useRef(null);
    const [tool, setTool] = useState('glue');
    const [color, setColor] = useState(COLORS[0]);
    const btn = (label, on, onClick, cls) => h('button', { 'aria-pressed': on === undefined ? undefined : String(on), className: cls, onClick }, label);
    return h('div', { style: { position: 'absolute', inset: 0 } },
      h(Glitter, { ref: g, tool, color, heap: false }),
      h('div', { className: 'hint' }, HINTS[tool]),
      h('div', { className: 'bar' },
        h('div', { className: 'group' },
          btn('Glue', tool === 'glue', () => setTool('glue')),
          btn('Glitter', tool === 'glitter', () => setTool('glitter')),
          btn('Push', tool === 'push', () => setTool('push'))),
        h('span', { className: 'sep' }),
        ...COLORS.map((c) => h('button', { className: 'sw', 'aria-label': 'Glitter colour ' + c, 'aria-pressed': String(color === c), style: { background: c }, onClick: () => setColor(c) })),
        h('input', { type: 'color', value: color, 'aria-label': 'Any glitter colour', onChange: (e) => setColor(e.target.value) }),
        h('span', { className: 'sep' }),
        btn('Pour', undefined, () => g.current.pour(), 'act'),
        btn('Blow', undefined, () => g.current.blow(), 'act'),
        h('span', { className: 'sep' }),
        btn('Clear glitter', undefined, () => g.current.clear()),
        btn('Clear glue', undefined, () => g.current.clearGlue())));
  }
  createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
